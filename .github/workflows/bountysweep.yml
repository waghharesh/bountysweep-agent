name: BountySweep Autonomous Cloud Agent

on:
  schedule:
    # Runs automatically every 30 minutes on GitHub's free Ubuntu VMs (with Docker pre-installed)
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      loops:
        description: "Number of consecutive scan cycles to run in this VM session"
        required: false
        default: "6"
      use_mock:
        description: "Run simulated mock escrow cycle (true/false)"
        required: false
        default: "false"

concurrency:
  group: bountysweep-autonomous-runner
  cancel-in-progress: false

jobs:
  bountysweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout BountySweep Agent
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-pull Isolated Sandbox Base Image
        run: |
          docker pull python:3.12-slim

      - name: Run Autonomous BountySweep Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.BOUNTY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          WORKER_PRIVATE_KEY: ${{ secrets.WORKER_PRIVATE_KEY }}
          OWNER_COLD_WALLET_ADDRESS: ${{ secrets.OWNER_COLD_WALLET_ADDRESS }}
          CHAIN_NETWORK: ${{ vars.CHAIN_NETWORK || 'base' }}
          SWEEP_THRESHOLD_USDC: ${{ vars.SWEEP_THRESHOLD_USDC || '5.0' }}
          DRY_RUN_MODE: ${{ vars.DRY_RUN_MODE || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MOCK_FLAG=""
          if [ "${{ github.event.inputs.use_mock }}" = "true" ]; then
            MOCK_FLAG="--mock"
          fi
          LOOPS="${{ github.event.inputs.loops || '1' }}"
          python run_autonomous_cycle.py --loops "$LOOPS" --interval 300 $MOCK_FLAG
