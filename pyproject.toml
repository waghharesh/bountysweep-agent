[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bountysweep-agent"
version = "1.0.0"
description = "Autonomous coding bounty discovery, Gemini triage, isolated Docker sandbox verification, and immutable cold-wallet USDC settlement service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "docker>=7.1.0",
    "google-genai>=1.0.0",
    "web3>=7.0.0",
    "solders>=0.21.0",
    "solana>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

